<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">GenLayer Consensus Spinner</title>
  <desc id="desc">A seamless loading spinner inspired by independent agents converging into a shared state.</desc>
  <g color="#110FFF">
    <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".22"
      d="M60 15 L99 37 M99 37 L99 83 M99 83 L60 105 M60 105 L21 83 M21 83 L21 37 M21 37 Z"/>

    <circle fill="none" stroke="currentColor" stroke-width="3" cx="60" cy="60" r="14" opacity=".9"/>

    <!-- node A: top (stays put, only breathes) -->
    <circle fill="currentColor" cx="60" cy="15" r="5.5">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;.72;1" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- node B: upper right -->
    <circle fill="currentColor" cx="99" cy="37" r="5.5">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0;-3,2;0,0" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;.72;1" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- node C: lower right -->
    <circle fill="currentColor" cx="99" cy="83" r="5.5">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0;-3,-2;0,0" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;.72;1" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- node D: bottom -->
    <circle fill="currentColor" cx="60" cy="105" r="5.5">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;.72;1" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- node E: lower left -->
    <circle fill="currentColor" cx="21" cy="83" r="5.5">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0;3,-2;0,0" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;.72;1" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- node F: upper left -->
    <circle fill="currentColor" cx="21" cy="37" r="5.5">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0;3,2;0,0" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1;.72;1" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
