    <circle fill="none" stroke="currentColor" stroke-width="3" cx="60" cy="60" r="14" opacity=".9"/>

    <circle fill="currentColor" cx="60" cy="15" r="5.5">
      <animate attributeName="cy" values="15;26.25;15" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5.5;4;5.5" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle fill="currentColor" cx="99" cy="37" r="5.5">
      <animate attributeName="cx" values="99;89.25;99" keyTimes="0;.5;1" calcMode="spline"
