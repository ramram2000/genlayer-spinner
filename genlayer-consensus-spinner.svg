      <animate attributeName="cy" values="83;77.25;83" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5.5;4;5.5" keyTimes="0;.5;1" calcMode="spline"
        keySplines=".65 0 .35 1;.65 0 .35 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle fill="currentColor" cx="60" cy="105" r="5.5">
