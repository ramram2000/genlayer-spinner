<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GenLayer Consensus Spinner — Preview</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #EFEFEF;
    color: #070707;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 50px 20px;
    flex-wrap: wrap;
  }
  .swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 36px;
    border-radius: 16px;
    min-width: 160px;
  }
  .light { background: #FFFFFF; }
  .dark  { background: #070707; }
  .light span { color: #606060; }
  .dark span { color: #CACACA; }
  span { font-size: 13px; letter-spacing: 0.02em; }

  .sz-16 { width: 16px; height: 16px; }
  .sz-24 { width: 24px; height: 24px; }
  .sz-48 { width: 48px; height: 48px; }
  .sz-96 { width: 96px; height: 96px; }

  h1 { text-align: center; font-size: 18px; font-weight: 600; padding-top: 40px; margin-bottom: 4px; }
  h2 { text-align: center; font-size: 14px; font-weight: 500; color: #606060; margin-top: 0; }
</style>
</head>
<body>

<h1>GenLayer Consensus Spinner</h1>
<h2>Five validators, independent rhythm, one shared moment of agreement</h2>

<div class="row">
  <div class="swatch light">
    <img src="genlayer-consensus-spinner.svg" class="sz-96" alt="spinner">
    <span>96px / light</span>
  </div>
  <div class="swatch dark">
    <img src="genlayer-consensus-spinner.svg" class="sz-96" alt="spinner">
    <span>96px / dark</span>
  </div>
</div>

<div class="row">
  <div class="swatch light">
    <img src="genlayer-consensus-spinner.svg" class="sz-48" alt="spinner">
    <span>48px / light</span>
  </div>
  <div class="swatch dark">
    <img src="genlayer-consensus-spinner.svg" class="sz-48" alt="spinner">
    <span>48px / dark</span>
  </div>
  <div class="swatch light">
    <img src="genlayer-consensus-spinner.svg" class="sz-24" alt="spinner">
    <span>24px / light</span>
  </div>
  <div class="swatch dark">
    <img src="genlayer-consensus-spinner.svg" class="sz-24" alt="spinner">
    <span>24px / dark</span>
  </div>
  <div class="swatch light">
    <img src="genlayer-consensus-spinner.svg" class="sz-16" alt="spinner">
    <span>16px / light</span>
  </div>
  <div class="swatch dark">
    <img src="genlayer-consensus-spinner.svg" class="sz-16" alt="spinner">
    <span>16px / dark</span>
  </div>
</div>

</body>
</html>
